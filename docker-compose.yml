# Ambiente completo: Airflow 3.3.1 + AdventureWorks OLTP (origem) + Data Warehouse (destino)
# Baseado no ambiente da disciplina (aula.etl.2). Subir com:
#   docker compose up airflow-init
#   docker compose up -d
name: aw-dw-airflow

x-airflow-common: &airflow-common
  image: apache/airflow:3.3.1
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "${AIRFLOW_PARALLELISM:-4}"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "${AIRFLOW_MAX_ACTIVE_TASKS_PER_DAG:-2}"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__LOAD_EXAMPLES: "${AIRFLOW_LOAD_EXAMPLES:-false}"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__LOGGING__LOGGING_LEVEL: "${AIRFLOW_LOGGING_LEVEL:-WARNING}"
    # Conexoes usadas pelas DAGs (criadas por variavel de ambiente, sem cadastro manual na UI)
    AIRFLOW_CONN_AW_OLTP: postgresql://postgres:${AW_PASSWORD}@aw-oltp:5432/adventureworks
    AIRFLOW_CONN_AW_DW: postgresql://postgres:${AW_PASSWORD}@aw-dw:5432/adventureworks_dw
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  # ---------- Metadados do Airflow ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    shm_size: 128mb
    restart: unless-stopped

  # ---------- ORIGEM: AdventureWorks OLTP ----------
  # Na primeira subida restaura oltp/01_adventureworks_oltp.sql.gz (~1-2 min).
  aw-oltp:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AW_PASSWORD}
      POSTGRES_DB: adventureworks
    ports:
      - "5433:5432"
    volumes:
      - aw-oltp-volume:/var/lib/postgresql/data
      - ./oltp:/docker-entrypoint-initdb.d:ro
      - ./sql:/sql:ro
    healthcheck:
      # durante a restauracao o Postgres nao aceita TCP; so fica "healthy" ao terminar
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d adventureworks"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 512m
    restart: unless-stopped

  # ---------- DESTINO: Data Warehouse ----------
  aw-dw:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AW_PASSWORD}
      POSTGRES_DB: adventureworks_dw
    ports:
      - "5434:5432"
    volumes:
      - aw-dw-volume:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d adventureworks_dw"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    restart: "no"
    mem_limit: 768m

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 768m

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--local"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
      aw-oltp:
        condition: service_healthy
      aw-dw:
        condition: service_healthy
    mem_limit: 768m

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 512m

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 512m

volumes:
  postgres-db-volume:
  aw-oltp-volume:
  aw-dw-volume:
